<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <!-- <meta http-equiv="X-UA-Compatible" content="ie=edge"> -->
    <title>Prototype HTML</title>
    <link rel="stylesheet" href="../style.css">
  </head>

  <body>
    <script src="index.js"></script>

    <div class="over_container">
      <div class="top_container">
        <div class="top_menu">
          <div id="top_logo">["Logo"]</div>
          <div id="top_home"><a href="../home">Home</a></div>
          <div id="top_cryptocurrencies"><a href="../cryptocurrencies">Cryptocurrencies</a></div>
          <div id="top_markets"><a href="../markets">Markets</a></div>
          <div id="top_guide"><a href=../guide>Guide</a></div>
        </div>
        <div id="top_account"><a href=account>Account</a></div>
      </div>

      <div class="main_container"> 
        <div class="left_container">
            <div id="home_title">[insert cryptocurrency]</div>
            <div id="home_chart"></div>
        </div>
        <div class="right_container">
            <div id="crypto_title">Coins</div>
            <div class="cryptocurrencies_list">
                <div id="bitcoin">Bitcoin <strong>BTC</strong> <span id=price>[price]</span>
                <br><span id=stock_info>[percentage change] [market cap]</span></div>
                <div id="ethereum">Ethereum <strong>ETH</strong> <span id=price>[price]</span>
                <br><span id=stock_info>[percentage change] [market cap]</span></div>
                <div id="tether">Tether <strong>USDT</strong> <span id=price>[price]</span>
                <br><span id=stock_info>[percentage change] [market cap]</span></div>
            </div>
        </div>
      </div>

  </body>
</html>
